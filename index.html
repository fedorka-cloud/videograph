<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <title>Title</title>
</head>
    <div class="wrapper">
        <header class="header-container">
            <div class="logo">
                <div class="left">
                    <img src="img/Star_logo.png" alt="" class="logo-png">
                    <p class="logo_name">Ink. House</p>
                </div>
                <div class="right">
                    <p>Репродукции</p>
                    <p>Новинки</p>
                    <p>О нас</p>
                    <img src="img/shopping-cart.png" alt="" class="market_logo">
                </div>
            </div>
        </header>
        <main>
            <section class="bird-container">
                <img src="img/bird.png" alt="" class="bird_png">
                <div class="bird_text">
                    <div class="bird_name">
                        <p class="bird_title">Реплики картин <br>от <span class="title-color">Ink. House</span></p>
                        <p class="bird_description">Высокое качество отрисовки на плотной бумаге или <br>льняном холсте. Редкие произведения, доступные цены.</p>
                    </div>
                    <div class="bird_btn">Продукция</div>
                </div>
            </section>
            <div>2</div>
            <div>3</div>
            <div>4</div>
        </main>
        <footer>footer</footer>
    </div>
</html>
